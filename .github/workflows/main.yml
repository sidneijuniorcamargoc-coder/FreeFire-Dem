name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip FreeFireDemo-Android-Source.zip -d project
          find project -maxdepth 3 -type f

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd project/FreeFireDemo
          chmod +x gradlew
          ./gradlew assembleDebug
          
